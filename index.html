<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Pool CAPTCHA</title>
<style>
  :root {
    --accent-yellow: #ffd91a;
    --accent-blue: #1e50d1;
    --accent-red: #d1231e;
    --accent-purple: #7a1ed1;
    --accent-green: #1e8a3d;
    --text-primary: #202124;
    --text-secondary: #5f6368;
    --surface: #ffffff;
    --surface-alt: #f3f5fb;
    --border: #dfe1e5;
    --shadow-sm: 0 1px 2px rgba(32, 33, 36, 0.16), 0 1px 3px rgba(32, 33, 36, 0.08);
    --shadow-md: 0 2px 6px rgba(32, 33, 36, 0.16), 0 4px 16px rgba(32, 33, 36, 0.1);
    --radius: 14px;
  }
  html, body {
    margin: 0;
    background: #fff;
  }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .hidden {
    display: none !important;
  }

  #wrapper {
    max-width: 760px;
    margin: 56px auto;
    padding: 0 24px 60px;
    box-sizing: border-box;
  }
  #site-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 40px;
  }
  #site-brand svg {
    display: block;
    flex-shrink: 0;
  }
  #site-name {
    font-weight: 700;
    font-size: 18px;
    color: #1a1a1a;
    letter-spacing: -0.01em;
  }
  #site-name .tld {
    color: #3f6fd1;
  }
  #page-title {
    font-size: 32px;
    line-height: 1.2;
    margin: 0 0 12px;
    color: #111;
  }
  #page-subtitle {
    font-size: 17px;
    font-weight: 400;
    color: #444;
    margin: 0 0 28px;
  }
  #page-footer {
    margin-top: 40px;
    font-size: 14px;
    color: #666;
    max-width: 560px;
    line-height: 1.5;
  }
  @media (max-width: 480px) {
    #page-title { font-size: 26px; }
    #page-subtitle { font-size: 15px; }
  }

  #checkbox-card {
    display: flex;
    align-items: center;
    gap: 18px;
    width: 300px;
    box-sizing: border-box;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 20px;
    box-shadow: var(--shadow-sm);
    cursor: pointer;
    position: relative;
    z-index: 1;
  }
  #verify-checkbox {
    width: 26px;
    height: 26px;
    margin: 0;
    accent-color: var(--accent-green);
  }
  #loader-checkbox {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: conic-gradient(
      var(--accent-yellow) 0deg 90deg,
      var(--accent-blue) 90deg 180deg,
      var(--accent-red) 180deg 270deg,
      var(--accent-purple) 270deg 360deg
    );
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
    mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
    animation: spin 0.9s linear infinite;
  }
  #checkmark {
    font-size: 22px;
    color: var(--accent-green);
    font-weight: bold;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  .checkbox-text {
    flex: 1;
    font-size: 14px;
    color: var(--text-primary);
  }
  .widget-brand {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }
  .widget-brand .wordmark {
    font-size: 8px;
    letter-spacing: 0.02em;
    color: var(--text-secondary);
    text-transform: uppercase;
  }

  #challenge-wrap {
    position: relative;
    margin-top: 8px;
  }
  #arrow {
    position: absolute;
    top: -7px;
    left: 32px;
    width: 12px;
    height: 12px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    border-left: 1px solid var(--border);
    transform: rotate(45deg);
  }
  #challenge-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    box-shadow: var(--shadow-md);
    width: min(92vw, 640px);
    box-sizing: border-box;
  }
  #versus-label {
    color: var(--text-secondary);
    font-size: 12px;
    font-weight: 600;
    text-align: center;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 6px;
  }
  #table-wrap {
    position: relative;
  }
  #intro-banner {
    position: absolute;
    inset: 0;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 24px;
    color: #fff;
    background: rgba(20, 30, 64, 0.68);
    font-size: 20px;
    font-weight: 700;
    text-align: center;
    line-height: 1.3;
    border-radius: 8px;
    opacity: 1;
    transition: opacity 0.4s ease;
  }
  #intro-banner.fade-out {
    opacity: 0;
  }
  #intro-banner.hidden {
    display: none;
  }
  #hud {
    color: var(--text-primary);
    font-size: 14px;
    font-weight: 500;
    min-height: 1.2em;
    text-align: center;
    margin-bottom: 8px;
  }
  .side-you {
    color: var(--accent-blue);
    font-weight: 700;
  }
  .side-opp {
    color: var(--accent-red);
    font-weight: 700;
  }
  #table {
    touch-action: none;
    display: block;
    border-radius: 8px;
  }
  #result-banner {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    color: var(--text-primary);
    font-size: 15px;
    font-weight: 500;
    text-align: center;
    margin-top: 10px;
  }
  #try-again {
    font-size: 14px;
    font-weight: 600;
    padding: 8px 18px;
    border-radius: 999px;
    border: none;
    background: var(--accent-blue);
    color: #fff;
    cursor: pointer;
    box-shadow: var(--shadow-sm);
  }
  #try-again:hover {
    background: #1740ad;
  }
</style>
</head>
<body>
<div id="wrapper">
  <div id="site-brand">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
      <path d="M12 2 L21 5.5 V11 C21 16 17 20 12 22 C7 20 3 16 3 11 V5.5 Z" fill="#3f6fd1" />
    </svg>
    <span id="site-name">meridian<span class="tld">.io</span></span>
  </div>
  <h1 id="page-title">Verifying your connection</h1>
  <p id="page-subtitle">We need to confirm you're human before you can continue.</p>

  <label id="checkbox-card">
    <input type="checkbox" id="verify-checkbox" />
    <div id="loader-checkbox" class="hidden"></div>
    <div id="checkmark" class="hidden">&#10003;</div>
    <span class="checkbox-text">I'm not a robot</span>
    <div class="widget-brand">
      <svg width="30" height="30" viewBox="0 0 40 40">
        <path d="M20,20 L38,20 A18,18 0 0,1 20,38 Z" fill="#ffd91a" />
        <path d="M20,20 L20,38 A18,18 0 0,1 2,20 Z" fill="#1e50d1" />
        <path d="M20,20 L2,20 A18,18 0 0,1 20,2 Z" fill="#d1231e" />
        <path d="M20,20 L20,2 A18,18 0 0,1 38,20 Z" fill="#7a1ed1" />
      </svg>
      <div class="wordmark">poolCAPTCHA</div>
    </div>
  </label>

  <div id="challenge-wrap">
    <div id="arrow" class="hidden"></div>
    <div id="challenge-card" class="hidden">
      <div id="versus-label"></div>
      <div id="hud"></div>
      <div id="table-wrap">
        <canvas id="table"></canvas>
        <div id="intro-banner" class="hidden"></div>
      </div>
      <div id="result-banner" class="hidden">
        <span id="result-text"></span>
        <button id="try-again" class="hidden">Try Again</button>
      </div>
    </div>
  </div>

  <p id="page-footer">meridian.io checks every visitor before granting access to this page.</p>
</div>
<script type="module">
import {
  simulateShot,
  placeCueBall,
  callPocket,
  isEightBallShot,
  chooseComputerShot,
  createInitialState,
  TABLE,
  BALL_RADIUS,
  POCKETS,
  DT,
} from "./game.js";
import { classifyReaimGesture } from "./input.js";

const hud = document.getElementById("hud");
const versusLabel = document.getElementById("versus-label");
const introBanner = document.getElementById("intro-banner");
const verifyCheckbox = document.getElementById("verify-checkbox");
const loaderCheckbox = document.getElementById("loader-checkbox");
const checkmark = document.getElementById("checkmark");
const arrow = document.getElementById("arrow");
const challengeCard = document.getElementById("challenge-card");
const resultBanner = document.getElementById("result-banner");
const resultText = document.getElementById("result-text");
const tryAgainBtn = document.getElementById("try-again");

const canvas = document.getElementById("table");
const ctx = canvas.getContext("2d");

const OPPONENT_NAMES = ["Neckbeard", "xXPocketMasterXx", "CarpalTunnelKing", "Divorced_At_The_Bar", "ChalkGod420", "Uncle_Dennys_Special"];

function pickOpponentName() {
  return OPPONENT_NAMES[Math.floor(Math.random() * OPPONENT_NAMES.length)];
}

/** Re-rolled once per Challenge (initial load and each "Try Again"); stays fixed for the rest of that game. */
let opponentName = pickOpponentName();

function updateVersusLabel() {
  versusLabel.textContent = `You vs. ${opponentName}`;
}

const INTRO_BANNER_VISIBLE_MS = 3000;
const INTRO_BANNER_FADE_MS = 400; // matches #intro-banner's CSS opacity transition

/** Blocks table interaction while shown, so the intro moment lands before the Challenge is actually playable. */
function showIntroBanner() {
  introBanner.textContent = `Beat ${opponentName} to verify you're human`;
  introBanner.classList.remove("hidden", "fade-out");
  canvas.style.pointerEvents = "none";
  setTimeout(() => {
    introBanner.classList.add("fade-out");
    setTimeout(() => {
      introBanner.classList.add("hidden");
      canvas.style.pointerEvents = "auto";
    }, INTRO_BANNER_FADE_MS);
  }, INTRO_BANNER_VISIBLE_MS);
}

// Debug/testing entry point: load with ?sandbox=endgame to skip straight to an
// "almost won" state (player is Solids, one solid left, 8-ball still up) instead
// of a fresh break, so the win/loss end-game flow can be tested without playing
// a full game out each time. Not linked from the UI anywhere.
const SANDBOX_MODE = new URLSearchParams(location.search).get("sandbox");

/** Player is Solids with only the 1-ball left on the table; the 8-ball is still up. */
function createSandboxEndgameState() {
  const sandboxState = createInitialState();
  sandboxState.tableOpen = false;
  sandboxState.groups = { A: "solid", B: "stripe" };
  let solidsRemaining = 1;
  for (const b of sandboxState.balls) {
    if (b.group !== "solid") continue;
    if (solidsRemaining > 0) {
      solidsRemaining--;
    } else {
      b.pocketed = true;
    }
  }
  return sandboxState;
}

function freshGameState() {
  return SANDBOX_MODE === "endgame" ? createSandboxEndgameState() : createInitialState();
}

let state = freshGameState();

/** idle | aiming | armed | pulling | animating */
let phase = "idle";
let aimAngle = 0;
let pullPower = 0;
let pullStart = null;
let animation = null; // { frames, startTime }

function cueBall(balls) {
  return balls.find((b) => b.id === "cue");
}

const BALL_COLORS = {
  1: "#ffd91a", 2: "#1e50d1", 3: "#d1231e", 4: "#7a1ed1",
  5: "#e07a1e", 6: "#1e8a3d", 7: "#6b2a1e", 8: "#111111",
};

function colorFor(id) {
  if (id === "cue") return "#f5f5f0";
  const n = Number(id);
  return n <= 8 ? BALL_COLORS[n] : BALL_COLORS[n - 8];
}

function isStripe(ball) {
  return ball.group === "stripe";
}

function resize() {
  if (challengeCard.classList.contains("hidden")) return;

  const cardPadding = 20; // 10px padding each side, from #challenge-card CSS
  const availW = challengeCard.clientWidth - cardPadding;
  const availH = window.innerHeight * 0.7;
  const aspect = TABLE.width / TABLE.height;
  let cssW = availW;
  let cssH = cssW / aspect;
  if (cssH > availH) {
    cssH = availH;
    cssW = cssH * aspect;
  }
  const dpr = window.devicePixelRatio || 1;
  canvas.style.width = cssW + "px";
  canvas.style.height = cssH + "px";
  canvas.width = cssW * dpr;
  canvas.height = cssH * dpr;
  ctx.setTransform(dpr * (cssW / TABLE.width), 0, 0, dpr * (cssH / TABLE.height), 0, 0);
}
window.addEventListener("resize", resize);

// Browsers restore form control values (checked state) across a same-page reload
// independently of this script, so force it back to unchecked on load.
verifyCheckbox.checked = false;

let started = false;
verifyCheckbox.addEventListener("input", () => {
  if (started) return;
  started = true;
  verifyCheckbox.classList.add("hidden");
  loaderCheckbox.classList.remove("hidden");
  setTimeout(() => {
    arrow.classList.remove("hidden");
    challengeCard.classList.remove("hidden");
    resize();
    updateVersusLabel();
    showIntroBanner();
  }, 500);
});

function pointerTablePos(evt) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: ((evt.clientX - rect.left) / rect.width) * TABLE.width,
    y: ((evt.clientY - rect.top) / rect.height) * TABLE.height,
  };
}

// Rail (Material blue, ticket 07) is drawn as a rounded frame, then each Pocket
// punches a hole through it so the rail visibly curves around the pocket mouth
// instead of a plain rectangle with a circle floating on top (ticket 11).
const RAIL_COLOR = "#2c4faa";
const RAIL_WIDTH = 28;
const RAIL_OUTER_CORNER_RADIUS = 10;
const RAIL_INNER_CORNER_RADIUS = 6;

// Corner pockets read larger/more open than side (middle-rail) pockets, matching
// a real table's proportions.
const POCKET_GEOM = {
  corner: { railCut: 42, mouth: 24 },
  side: { railCut: 34, mouth: 19 },
};

function isCornerPocket(p) {
  return (p.x === 0 || p.x === TABLE.width) && (p.y === 0 || p.y === TABLE.height);
}

function pocketGeom(p) {
  return isCornerPocket(p) ? POCKET_GEOM.corner : POCKET_GEOM.side;
}

/** Angle from a pocket toward table center, used to orient the mouth's rim highlight. */
function angleTowardTableCenter(p) {
  return Math.atan2(TABLE.height / 2 - p.y, TABLE.width / 2 - p.x);
}

function addRoundedRectPath(path, x, y, w, h, r) {
  path.moveTo(x + r, y);
  path.arcTo(x + w, y, x + w, y + h, r);
  path.arcTo(x + w, y + h, x, y + h, r);
  path.arcTo(x, y + h, x, y, r);
  path.arcTo(x, y, x + w, y, r);
  path.closePath();
}

function drawRailAndPockets() {
  const outerRect = new Path2D();
  addRoundedRectPath(outerRect, 0, 0, TABLE.width, TABLE.height, RAIL_OUTER_CORNER_RADIUS);
  const innerRect = new Path2D();
  addRoundedRectPath(
    innerRect,
    RAIL_WIDTH,
    RAIL_WIDTH,
    TABLE.width - RAIL_WIDTH * 2,
    TABLE.height - RAIL_WIDTH * 2,
    RAIL_INNER_CORNER_RADIUS
  );

  const railFrame = new Path2D();
  railFrame.addPath(outerRect);
  railFrame.addPath(innerRect);

  ctx.save();
  ctx.shadowColor = "rgba(32, 33, 36, 0.35)";
  ctx.shadowBlur = 10;
  ctx.fillStyle = RAIL_COLOR;
  ctx.fill(railFrame, "evenodd");
  ctx.restore();

  // Raised-cushion highlight where the rail meets the felt.
  ctx.save();
  ctx.strokeStyle = "rgba(255, 255, 255, 0.14)";
  ctx.lineWidth = 2;
  ctx.stroke(innerRect);
  ctx.restore();

  // Punch a hole through the rail at each pocket so it curves around the mouth
  // rather than terminating in a hard corner/edge.
  ctx.save();
  ctx.globalCompositeOperation = "destination-out";
  POCKETS.forEach((p) => {
    const g = pocketGeom(p);
    ctx.beginPath();
    ctx.arc(p.x, p.y, g.railCut, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.restore();
}

function drawPocketMouth(p, g) {
  const gradient = ctx.createRadialGradient(p.x, p.y, g.mouth * 0.15, p.x, p.y, g.mouth);
  gradient.addColorStop(0, "#0a0b0d");
  gradient.addColorStop(0.7, "#1b1d21");
  gradient.addColorStop(1, "#303338");

  ctx.save();
  ctx.shadowColor = "rgba(0, 0, 0, 0.5)";
  ctx.shadowBlur = 8;
  ctx.fillStyle = gradient;
  ctx.beginPath();
  ctx.arc(p.x, p.y, g.mouth, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // Rim highlight on the felt-facing side of the mouth, suggesting the cloth-covered
  // jaw catching light as it curves down into the pocket.
  const towardCenter = angleTowardTableCenter(p);
  ctx.save();
  ctx.strokeStyle = "rgba(255, 255, 255, 0.2)";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(p.x, p.y, g.mouth - 2, towardCenter - Math.PI / 2.4, towardCenter + Math.PI / 2.4);
  ctx.stroke();
  ctx.restore();
}

function draw() {
  ctx.clearRect(0, 0, TABLE.width, TABLE.height);

  ctx.fillStyle = "#4a72e0";
  ctx.fillRect(0, 0, TABLE.width, TABLE.height);

  drawRailAndPockets();

  const selectingPocket = isEightBallShot(state) && state.calledPocket == null && !state.gameOver;
  POCKETS.forEach((p, i) => {
    const g = pocketGeom(p);
    drawPocketMouth(p, g);

    if (selectingPocket || state.calledPocket === i) {
      ctx.strokeStyle = "rgba(255,220,60,0.9)";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(p.x, p.y, g.mouth + 9, 0, Math.PI * 2);
      ctx.stroke();
    }
  });

  const balls = currentBalls();
  for (const b of balls) {
    if (b.pocketed) continue;
    drawBall(b);
  }

  if (phase === "aiming" || phase === "armed" || phase === "pulling") {
    drawAimLine(cueBall(balls));
  }
}

function drawBall(b) {
  ctx.save();
  ctx.translate(b.x, b.y);

  ctx.save();
  ctx.shadowColor = "rgba(32, 33, 36, 0.35)";
  ctx.shadowBlur = 5;
  ctx.shadowOffsetY = 2;
  ctx.fillStyle = isStripe(b) ? "#f5f5f0" : colorFor(b.id);
  ctx.beginPath();
  ctx.arc(0, 0, BALL_RADIUS, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  if (isStripe(b)) {
    ctx.save();
    ctx.beginPath();
    ctx.arc(0, 0, BALL_RADIUS, 0, Math.PI * 2);
    ctx.clip();
    ctx.fillStyle = colorFor(b.id);
    ctx.fillRect(-BALL_RADIUS, -BALL_RADIUS * 0.45, BALL_RADIUS * 2, BALL_RADIUS * 0.9);
    ctx.restore();
  }

  if (b.id !== "cue") {
    ctx.beginPath();
    ctx.fillStyle = "#f5f5f0";
    ctx.arc(0, 0, BALL_RADIUS * 0.55, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#111";
    ctx.font = `${BALL_RADIUS * 0.7}px sans-serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(b.id, 0, 1);
  }

  ctx.restore();
}

function drawAimLine(cue) {
  const dx = Math.cos(aimAngle);
  const dy = Math.sin(aimAngle);
  const pullOffset = phase === "pulling" ? pullPower * 60 : 0;

  ctx.strokeStyle = "rgba(255,255,255,0.85)";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(cue.x - dx * pullOffset, cue.y - dy * pullOffset);
  ctx.lineTo(cue.x + dx * 400, cue.y + dy * 400);
  ctx.stroke();

  if (phase === "pulling") {
    ctx.fillStyle = "rgba(255,60,60,0.9)";
    ctx.fillRect(20, 20, 12, 150);
    ctx.fillStyle = "#fff";
    ctx.fillRect(20, 20 + 150 * (1 - pullPower), 12, 150 * pullPower);
  }
}

function currentBalls() {
  if (animation) {
    const elapsed = (performance.now() - animation.startTime) / 1000;
    const idx = Math.min(animation.frames.length - 1, Math.floor(elapsed / DT));
    return animation.frames[idx].balls;
  }
  return state.balls;
}

function updateAimFromPointer(evt) {
  const p = pointerTablePos(evt);
  const cue = cueBall(state.balls);
  aimAngle = Math.atan2(p.y - cue.y, p.x - cue.x);
}

function nearestPocketIndex(p, maxDist = 60) {
  let best = -1;
  let bestDist = Infinity;
  POCKETS.forEach((pocket, i) => {
    const d = Math.hypot(p.x - pocket.x, p.y - pocket.y);
    if (d < bestDist) {
      bestDist = d;
      best = i;
    }
  });
  return bestDist <= maxDist ? best : -1;
}

canvas.addEventListener("pointerdown", (evt) => {
  if (state.gameOver || state.turn !== "A") return;
  if (state.ballInHand) {
    const p = pointerTablePos(evt);
    state = placeCueBall(state, p.x, p.y);
    updateHud();
    return;
  }
  if (isEightBallShot(state) && state.calledPocket == null) {
    const p = pointerTablePos(evt);
    const idx = nearestPocketIndex(p);
    if (idx !== -1) {
      state = callPocket(state, idx);
      updateHud();
    }
    return;
  }
  if (phase === "idle") {
    phase = "aiming";
    updateAimFromPointer(evt);
  } else if (phase === "armed") {
    // Where this second gesture starts relative to the cue ball decides everything
    // (ticket 13) — a start far from the cue ball is never a pull-back candidate,
    // no matter which way it later gets dragged, so classify right away using the
    // pointerdown position as both the gesture start and the current pointer.
    const p = pointerTablePos(evt);
    const cue = cueBall(state.balls);
    const result = classifyReaimGesture({ cue, aimAngle, gestureStart: p, pointer: p });
    if (result.type === "reaim") {
      // Started away from the cue ball: re-enter aiming immediately, same as the
      // original idle -> aiming gesture.
      phase = "aiming";
      aimAngle = result.angle;
    } else {
      // Started near the cue ball ("undecided" at zero movement): begin a candidate
      // pull-back. pointermove below resolves it into a real pull or a re-aim.
      phase = "pulling";
      pullStart = p;
      pullPower = 0;
    }
  }
});

canvas.addEventListener("pointermove", (evt) => {
  if (phase === "aiming") {
    updateAimFromPointer(evt);
  } else if (phase === "pulling") {
    const p = pointerTablePos(evt);
    const cue = cueBall(state.balls);
    const result = classifyReaimGesture({ cue, aimAngle, gestureStart: pullStart, pointer: p });
    if (result.type === "undecided") {
      // Not enough drag yet to tell a pull-back from a re-aim — hold at zero power.
      pullPower = 0;
    } else if (result.type === "pull") {
      // Genuine pull-back, started near the cue ball, along the already-set aim line:
      // this is the power gesture.
      pullPower = result.power;
    } else {
      // Re-aim: either not aligned with straight-back, or (structurally, per ticket 13)
      // this candidate never could have been a pull because it didn't start near the
      // cue ball — read it as a fresh re-aim instead of forcing it into the power gesture.
      phase = "aiming";
      pullPower = 0;
      aimAngle = result.angle;
    }
  }
});

canvas.addEventListener("pointerup", () => {
  if (phase === "aiming") {
    phase = "armed";
  } else if (phase === "pulling") {
    if (pullPower > 0) {
      fireShot();
    } else {
      // Released before any real pull-back was registered (e.g. a bare click/tap
      // while re-aiming) — don't fire a phantom zero-power shot, just stay armed.
      phase = "armed";
    }
  }
});

function fireShot() {
  performShot({ angle: aimAngle, power: pullPower });
}

function performShot(shot) {
  const result = simulateShot(state, shot);
  phase = "animating";
  animation = { frames: result.frames, startTime: performance.now() };

  const totalDuration = result.frames.length * DT * 1000;
  setTimeout(() => {
    state = result.state;
    animation = null;
    phase = "idle";
    pullPower = 0;
    updateHud();
    maybeTakeComputerTurn();
  }, totalDuration);
}

/** Computer Opponent — not literally AI, a scripted heuristic (chooseComputerShot). */
function maybeTakeComputerTurn() {
  if (state.gameOver || state.turn !== "B") return;

  if (state.ballInHand === "B") {
    state = placeCueBall(state, TABLE.width * 0.25, TABLE.height / 2);
    updateHud();
  }

  const shot = chooseComputerShot(state);
  if (shot.calledPocket != null && state.calledPocket == null) {
    state = callPocket(state, shot.calledPocket);
    updateHud();
  }
  animateComputerAimAndShoot(shot);
}

/** Plays the same aim-line / power-pull-back visuals a human's gesture would produce,
 *  so the Computer Opponent's turn reads as a real shot, not a jump-cut to ball movement. */
function animateComputerAimAndShoot(shot) {
  aimAngle = shot.angle;
  phase = "aiming";
  setTimeout(() => {
    phase = "armed";
    setTimeout(() => {
      phase = "pulling";
      const pullDurationMs = 350;
      const start = performance.now();
      function rampPull() {
        const t = Math.min(1, (performance.now() - start) / pullDurationMs);
        pullPower = t * shot.power;
        if (t < 1) {
          requestAnimationFrame(rampPull);
        } else {
          performShot({ angle: shot.angle, power: shot.power });
        }
      }
      rampPull();
    }, 150);
  }, 350);
}

function groupLabel(group) {
  if (group === "solid") return "Solids";
  if (group === "stripe") return "Stripes";
  return "Open table";
}

function sideLabel(side) {
  return side === "A" ? "You" : opponentName;
}

function sideBadgeHtml(side) {
  const cls = side === "A" ? "side-you" : "side-opp";
  return `<span class="${cls}">${sideLabel(side)}</span>`;
}

const GAME_OVER_REASONS = {
  "legal-win": "sank the 8-ball in the called pocket",
  "wrong-pocket": "sank the 8-ball in the wrong pocket",
  "foul-on-eight": "fouled while sinking the 8-ball",
  "early-pot": "sank the 8-ball early",
};

function updateHud() {
  if (state.gameOver) {
    const { winner, loser, reason } = state.gameOver;
    hud.innerHTML = `${sideBadgeHtml(winner)} won — ${sideBadgeHtml(loser)} ${GAME_OVER_REASONS[reason]}`;
  } else if (state.ballInHand) {
    hud.innerHTML = `${sideBadgeHtml(state.ballInHand)} — Ball in hand, tap the table to place the cue ball`;
  } else if (isEightBallShot(state) && state.calledPocket == null) {
    hud.innerHTML = `${sideBadgeHtml(state.turn)} — Tap a pocket to call the shot on the 8-ball`;
  } else {
    hud.innerHTML = `${sideBadgeHtml(state.turn)} — ${groupLabel(state.groups[state.turn])}`;
  }
  updateWidgetResult();
}

function updateWidgetResult() {
  if (!state.gameOver) {
    resultBanner.classList.add("hidden");
    tryAgainBtn.classList.add("hidden");
    canvas.style.pointerEvents = "auto";
    return;
  }

  canvas.style.pointerEvents = "none";
  resultBanner.classList.remove("hidden");

  if (state.gameOver.winner === "A") {
    loaderCheckbox.classList.add("hidden");
    checkmark.classList.remove("hidden");
    resultText.textContent = `Verified — you beat ${opponentName} at pool.`;
    tryAgainBtn.classList.add("hidden");
  } else {
    resultText.textContent = `Verification failed — ${opponentName} won.`;
    tryAgainBtn.classList.remove("hidden");
  }
}

tryAgainBtn.addEventListener("click", () => {
  state = freshGameState();
  opponentName = pickOpponentName();
  phase = "idle";
  animation = null;
  pullPower = 0;
  checkmark.classList.add("hidden");
  loaderCheckbox.classList.remove("hidden");
  updateVersusLabel();
  updateHud();
  showIntroBanner();
  maybeTakeComputerTurn();
});

function loop() {
  draw();
  requestAnimationFrame(loop);
}
loop();

updateHud();
maybeTakeComputerTurn();
</script>
</body>
</html>
